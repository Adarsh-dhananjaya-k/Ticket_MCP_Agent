<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ITSM AI Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- MS Teams JS SDK -->
    <script src="https://res.cdn.office.net/teams-js/2.12.0/js/MicrosoftTeams.min.js"></script>
    <style>
        body { background-color: #f5f5f5; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .log-user { color: #0d6efd; font-weight: bold; }
        .log-bot { color: #198754; font-weight: bold; }
        .log-tool { color: #6c757d; font-style: italic; font-size: 0.9em; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container" id="app-content" style="display:none;">
    <h2 class="mb-4">🛡️ ITSM AI Command Center</h2>
    
    <div class="row">
        <!-- MCP Server Controls -->
        <div class="col-md-4">
            <div class="card mb-4">
                <div class="card-header bg-dark text-white">🔌 MCP Microservices</div>
                <div class="card-body" id="mcp-list">
                    Loading connections...
                </div>
            </div>
        </div>

        <!-- Live Audit Logs -->
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <span>📡 Live Audit Logs</span>
                    <button class="btn btn-sm btn-light" onclick="loadLogs()">Refresh</button>
                </div>
                <div class="card-body" style="height: 500px; overflow-y: auto;">
                    <table class="table table-sm">
                        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead>
                        <tbody id="log-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="container text-center mt-5" id="access-denied" style="display:none;">
    <h1 class="text-danger">🔒 Access Denied</h1>
    <p>You do not have administrative privileges to view this dashboard.</p>
</div>

<script>
    // --- 1. TEAMS RBAC (Role-Based Access Control) ---
    const SUPER_ADMINS =["ai.vijeth@laratechconsulting.com"]; 
    
    microsoftTeams.app.initialize().then(() => {
        // Tell Teams the app loaded successfully (removes the loading spinner)
        microsoftTeams.app.notifySuccess();

        microsoftTeams.app.getContext().then((context) => {
            const userEmail = context.user.userPrincipalName;
            
            // Log this to your browser's Developer Tools so you can see exactly what email Teams is using
            console.log("🔒 RBAC Check - Logged in as:", userEmail);

            if (SUPER_ADMINS.includes(userEmail)) {
                document.getElementById('app-content').style.display = 'block';
                initDashboard();
            } else {
                document.getElementById('access-denied').style.display = 'block';
            }
        }).catch((err) => {
            console.error("❌ Failed to get Teams context:", err);
            document.getElementById('access-denied').style.display = 'block';
        });

    }).catch((err) => {
        // 🚨 THE FIX: No more backdoor. If SDK fails or is loaded outside Teams, lock it down!
        console.warn("⚠️ Not in Teams context or SDK failed.", err);
        document.getElementById('access-denied').style.display = 'block';
        document.getElementById('access-denied').innerHTML = "<h1 class='text-danger'>🔒 Access Denied</h1><p>Must be viewed inside Microsoft Teams.</p>";
    });

    // --- 2. DASHBOARD LOGIC ---
    let currentConfig = {};

    function initDashboard() {
        loadConfig();
        loadLogs();
        setInterval(loadLogs, 10000); // Auto-refresh logs every 10s
    }

    async function loadConfig() {
        const res = await fetch('/api/admin/config');
        currentConfig = await res.json();
        
        let html = '';
        currentConfig.mcp_servers.forEach((server, index) => {
            const isChecked = server.enabled ? 'checked' : '';
            html += `
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="mcp-${index}" ${isChecked} 
                           onchange="toggleServer(${index}, this.checked)">
                    <label class="form-check-label" for="mcp-${index}">
                        <strong>${server.name}</strong><br>
                        <small class="text-muted">${server.description}</small>
                    </label>
                </div>
            `;
        });
        document.getElementById('mcp-list').innerHTML = html;
    }

    async function toggleServer(index, isEnabled) {
        currentConfig.mcp_servers[index].enabled = isEnabled;
        await fetch('/api/admin/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(currentConfig)
        });
        alert(`Server ${currentConfig.mcp_servers[index].name} is now ${isEnabled ? 'ONLINE' : 'OFFLINE'}.`);
    }

    async function loadLogs() {
        const res = await fetch('/api/admin/logs');
        const logs = await res.json();
        let html = '';
        
        logs.forEach(log => {
            const time = new Date(log.timestamp).toLocaleTimeString();
            let actionText = '';
            let styleClass = '';
            
            if (log.role === 'user') { actionText = 'User Said'; styleClass = 'log-user'; }
            if (log.role === 'bot') { actionText = 'Bot Replied'; styleClass = 'log-bot'; }
            if (log.role === 'tool') { actionText = `⚙️ ${log.tool_name}`; styleClass = 'log-tool'; }

            html += `<tr>
                <td class="text-muted" style="width:100px;">${time}</td>
                <td><small>${log.user_email}</small></td>
                <td class="${styleClass}">${actionText}</td>
                <td><div style="max-height: 60px; overflow: hidden; text-overflow: ellipsis;">${log.message.substring(0, 150)}</div></td>
            </tr>`;
        });
        document.getElementById('log-table').innerHTML = html;
    }
</script>
</body>
</html>
